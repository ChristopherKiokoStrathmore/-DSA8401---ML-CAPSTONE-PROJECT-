[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone"
version = "0.1.0"
description = "DSA 8401 capstone: Airtel Kenya multi-head message pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.163.2",
    "gdown==6.5.1",
    "joblib==1.6.0",
    "matplotlib==3.9.2",
    "numpy==2.1.3",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "pyarrow==18.1.0",
    "pyyaml==6.0.2",
    "scikit-learn==1.5.2",
    "scipy==1.14.1",
    "torch>=2.5.1",
    "transformers==4.46.3",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
    "ruff==0.8.6",
]

[project.scripts]
prepare-data = "capstone.prepare_data:main"
generate-sample = "capstone.generate_sample:main"
download-weights = "capstone.weights:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-q", "--tb=short"]
